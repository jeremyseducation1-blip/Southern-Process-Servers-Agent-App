<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Status — Return &amp; Affidavit Log</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .case-row{
    padding:.8rem 0;
    border-bottom:1px solid var(--rule);
  }
  .case-row:last-child{ border-bottom:none; }
  .case-style{ font-weight:bold; }
  .case-meta{ font-size:.85rem; color:#555; margin-top:.2rem; }
  .status-pill{
    display:inline-block;
    padding:.1rem .6rem;
    border-radius:3px;
    font-size:.78rem;
    border:1px solid var(--rule);
    background:#fff;
    margin-top:.3rem;
  }
  .status-pill-open{
    background:#fbe4e4;
    border-color:#d98a8a;
    color:#7a1f1f;
    font-weight:bold;
  }
  .status-pill-closed{
    background:#e2f3e2;
    border-color:#8ec98e;
    color:#1f5c1f;
    font-weight:bold;
  }
  .attempt-history{
    margin-top:.4rem;
    padding:.4rem .6rem;
    background:#f3f0e8;
    border:1px solid var(--rule);
    border-radius:4px;
  }
  .attempt-history-title{
    font-weight:bold;
    font-size:.82rem;
    margin-bottom:.2rem;
  }
  .attempt-history-line{
    font-size:.8rem;
    padding:.1rem 0;
  }
  .filters{
    display:flex;
    flex-direction:column;
    gap:.5rem;
    margin-bottom:1rem;
  }
  .filters label{
    display:flex;
    flex-direction:column;
    font-size:.85rem;
    gap:.2rem;
  }
</style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1 id="pageTitle">Case Status</h1>
      <p class="hint" id="pageSubtitle">Loading…</p>

      <div class="filters">
        <label>Search (defendant, plaintiff, attorney, or address)
          <input type="text" id="searchInput" placeholder="e.g. Tello, or Delta Queen Dr">
        </label>
        <label>Logged on this date
          <input type="date" id="dateFilter">
        </label>
      </div>

      <div id="caseList"></div>
    </section>

    <section class="card" id="invoicesSection" hidden>
      <h1>Invoices</h1>
      <div id="invoicesList"></div>
    </section>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const titleEl = document.getElementById('pageTitle');
      const subtitleEl = document.getElementById('pageSubtitle');
      const listEl = document.getElementById('caseList');
      const searchInput = document.getElementById('searchInput');
      const dateFilter = document.getElementById('dateFilter');

      if (!token) {
        subtitleEl.textContent = 'Missing link token — check the URL you were given.';
        return;
      }

      let allCases = [];

      function renderCases(cases) {
        if (!cases.length) {
          listEl.innerHTML = '<p class="hint">No matching cases.</p>';
          return;
        }
        listEl.innerHTML = cases
          .map((c) => {
            const style = `${c.plaintiff || 'Unknown Plaintiff'} v. ${c.defendant || 'Unknown Defendant'}`;
            let statusLabel;
            if (c.status === 'closed') statusLabel = c.returnOutcome || 'Closed';
            else if (c.returnSent) statusLabel = 'Returned — affidavit pending';
            else statusLabel = 'Open';
            const statusPillClass = c.status === 'closed' ? 'status-pill status-pill-closed' : 'status-pill status-pill-open';
            const intake = c.intakeDate ? new Date(c.intakeDate).toLocaleDateString('en-US') : '';
            const sortedAttempts = (c.attempts || []).slice().sort((a, b) => a.n - b.n);
            const attemptHistory = sortedAttempts.length
              ? `<div class="attempt-history">` +
                `<div class="attempt-history-title">Attempts (${sortedAttempts.length}):</div>` +
                sortedAttempts
                  .map((a) => {
                    const photoNote = a.hasPhoto
                      ? ` · photo on file${a.photoTimestamp ? ', timestamped ' + new Date(a.photoTimestamp).toLocaleString('en-US') : ''}`
                      : '';
                    const noteText = a.note ? a.note.replace(/</g, '&lt;') : '(no note)';
                    return `<div class="attempt-history-line">#${a.n} — ${a.date || 'no date'}: ${noteText}${photoNote}</div>`;
                  })
                  .join('') +
                `</div>`
              : '';
            return `
              <div class="case-row">
                <div class="case-style">${style}</div>
                <div class="case-meta">Case No. ${c.caseNo || 'N/A'} — ${c.attorney || ''}${c.caseType ? ' — ' + c.caseType : ''}</div>
                <div class="case-meta">${c.serviceAddress || ''}</div>
                <div class="case-meta">Logged ${intake}</div>
                <span class="${statusPillClass}">${statusLabel}${c.returnDate ? ' · Returned ' + c.returnDate : ''}</span>
                ${attemptHistory}
              </div>`;
          })
          .join('');
      }

      function applyFilters() {
        const query = searchInput.value.trim().toLowerCase();
        const dateVal = dateFilter.value; // YYYY-MM-DD or ''

        const filtered = allCases.filter((c) => {
          if (dateVal) {
            const caseDate = c.intakeDate ? new Date(c.intakeDate).toISOString().slice(0, 10) : null;
            if (caseDate !== dateVal) return false;
          }
          if (query) {
            const haystack = [c.defendant, c.plaintiff, c.attorney, c.serviceAddress, ...(c.defendants || []).map((d) => d.name)]
              .filter(Boolean)
              .join(' ')
              .toLowerCase();
            if (!haystack.includes(query)) return false;
          }
          return true;
        });

        subtitleEl.textContent = `${filtered.length} case${filtered.length === 1 ? '' : 's'} shown (of ${allCases.length} total).`;
        renderCases(filtered);
      }

      searchInput.addEventListener('input', applyFilters);
      dateFilter.addEventListener('change', applyFilters);

      fetch('/.netlify/functions/view-cases?token=' + encodeURIComponent(token))
        .then(async (res) => {
          if (!res.ok) throw new Error(await res.text());
          return res.json();
        })
        .then(({ label, cases }) => {
          titleEl.textContent = label ? `Case Status — ${label}` : 'Case Status';
          allCases = cases || [];
          if (!allCases.length) {
            subtitleEl.textContent = 'No cases on file yet.';
            return;
          }
          subtitleEl.textContent = `${allCases.length} case${allCases.length === 1 ? '' : 's'} on file.`;
          renderCases(allCases);
        })
        .catch((err) => {
          subtitleEl.textContent = 'Could not load cases. (' + err.message + ')';
        });

      // Invoices -- only shows up at all for Kevin's ALL-scope link; a
      // firm-scoped link gets an empty array back and this section just
      // stays hidden.
      const invoicesSection = document.getElementById('invoicesSection');
      const invoicesListEl = document.getElementById('invoicesList');
      fetch('/.netlify/functions/view-invoices?token=' + encodeURIComponent(token))
        .then(async (res) => {
          if (!res.ok) return { invoices: [] };
          return res.json();
        })
        .then(({ invoices }) => {
          if (!invoices || !invoices.length) return;
          invoicesSection.hidden = false;
          invoicesListEl.innerHTML = invoices
            .map((inv) => {
              const generated = inv.generated_at ? new Date(inv.generated_at).toLocaleString('en-US') : '';
              const total = Number(inv.total || 0).toFixed(2);
              return (
                `<div class="case-row">` +
                `<div class="case-style">${inv.week_label || inv.week_key}</div>` +
                `<div class="case-meta">${inv.billable_count} case${inv.billable_count === 1 ? '' : 's'} — $${total} total</div>` +
                `<div class="case-meta">Generated ${generated}</div>` +
                `<button type="button" class="btn secondary view-invoice-btn" data-week="${inv.week_key}" style="margin-top:.4rem;">View PDF</button>` +
                `</div>`
              );
            })
            .join('');
          invoicesListEl.querySelectorAll('.view-invoice-btn').forEach((btn) => {
            btn.addEventListener('click', async () => {
              const weekKey = btn.dataset.week;
              const original = btn.textContent;
              btn.disabled = true;
              btn.textContent = 'Opening…';
              try {
                const res = await fetch('/.netlify/functions/get-invoice-pdf?week=' + encodeURIComponent(weekKey));
                if (!res.ok) throw new Error(await res.text());
                const { url } = await res.json();
                window.open(url, '_blank');
              } catch (err) {
                alert('Failed to open invoice. (' + err.message + ')');
              } finally {
                btn.disabled = false;
                btn.textContent = original;
              }
            });
          });
        })
        .catch(() => {
          // Silently ignore -- invoices are a bonus section, never block
          // the main case list over it.
        });
    })();
  </script>
</body>
</html>
