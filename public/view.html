<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Status — Southern Process Servers</title>
<meta name="theme-color" content="#0B2A5B">
<link rel="stylesheet" href="css/style.css?v=20261109">
<link rel="stylesheet" href="css/app-ui.css?v=20261109">
<style>
  /* Read-only viewer: same blue + yellow look as the app, no tab bar. */
  body.app-shell.viewer{ padding-bottom:24px; }
  .viewer .hero{ gap:12px; }
  .viewer .hero h1{ font-size:1.5rem; }
  .viewer .hero .hero-sub{ font-size:.85rem; }
  .viewer .filter-row{ display:flex; gap:10px; }
  .viewer .filter-row input{ flex:1; min-width:0; height:48px; border:0; border-radius:12px; background:#fff; padding:0 14px; font-size:1rem; color:#0B1F44; font-family:inherit; }
  .viewer .filter-row input[type=date]{ flex:0 0 auto; width:9.5rem; }
  .viewer .date-note{ font-size:.72rem; color:#B9C8E6; margin-top:-6px; }
  .viewer #caseList .case-row,
  .viewer #invoicesList .case-row{
    background:#fff; border:0; border-radius:14px; padding:14px; margin:0 0 10px;
    box-shadow:0 1px 4px rgba(11,42,91,.08);
  }
  .viewer .case-style{ font-weight:800; font-size:1rem; }
  .viewer .case-meta{ font-size:.85rem; color:#4A5B7C; margin-top:.2rem; }
  .viewer .status-pill{ display:inline-block; padding:.2rem .7rem; font-size:.78rem; margin-top:.5rem; }
  .viewer .attempt-history{ margin-top:.6rem; background:#F2F5FB; border:0; border-radius:12px; padding:10px 12px; }
  .viewer .attempt-history-title{ font-weight:800; font-size:.8rem; margin-bottom:.2rem; }
  .viewer .attempt-history-line{ font-size:.82rem; padding:.3rem 0; border-top:1px solid #DCE4F2; }
  .viewer .attempt-history-line:first-of-type{ border-top:0; }
  .viewer .btn.view-return-btn,.viewer .btn.view-invoice-btn{ width:100%; }
  .viewer details.notes-box{ margin-top:.6rem; background:#FFF8E1; border-radius:12px; padding:10px 12px; }
  .viewer details.notes-box summary{ font-weight:800; font-size:.9rem; cursor:pointer; }
  .viewer .note-bubble{ border-radius:12px; padding:8px 10px; margin-top:8px; max-width:92%; background:#fff; box-shadow:0 1px 3px rgba(11,42,91,.08); }
  .viewer .note-bubble.me{ margin-left:auto; background:#E8EEFC; }
  .viewer .note-meta{ font-size:.72rem; color:#4A5B7C; margin-bottom:2px; }
  .viewer .note-text{ white-space:pre-wrap; font-size:.95rem; color:#0B1F44; }
  .viewer .note-input{ width:100%; box-sizing:border-box; margin-top:10px; border:2px solid #C9D5EE; border-radius:12px; padding:10px 12px; font:inherit; font-size:1rem; }
  .viewer .note-add-btn{ width:100%; margin-top:8px; }
  .viewer .note-status{ font-size:.85rem; margin:.3rem 0 0; }
  .viewer h2.section-title{ font-size:1.05rem; font-weight:800; margin:18px 0 10px; color:#0B1F44; }
</style>
</head>
<body class="app-shell viewer">
  <div class="hero">
    <div class="hero-row"><div><div class="hero-sub" id="pageSubtitle">Loading…</div><h1 id="pageTitle">Case Status</h1></div></div>
    <div class="filter-row">
      <input type="text" id="searchInput" placeholder="Search cases" aria-label="Search (defendant, plaintiff, attorney, or address)">
      <input type="date" id="dateFilter" aria-label="Logged on this date">
    </div>
  </div>

  <main class="view-body">
    <div id="caseList"></div>

    <section id="invoicesSection" hidden>
      <h2 class="section-title">Invoices</h2>
      <div id="invoicesList"></div>
    </section>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const titleEl = document.getElementById('pageTitle');
      const subtitleEl = document.getElementById('pageSubtitle');
      const listEl = document.getElementById('caseList');
      const searchInput = document.getElementById('searchInput');
      const dateFilter = document.getElementById('dateFilter');

      if (!token) {
        subtitleEl.textContent = 'Missing link token — check the URL you were given.';
        return;
      }

      let allCases = [];
      const drafts = {};
      const openNotes = new Set();
      const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const noteTime = (iso) => new Date(iso).toLocaleString('en-US', { timeZone: 'America/Chicago', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      function threadHtml(c) {
        const log = c.notesLog || [];
        if (!log.length) return '<p class="hint">No notes yet. Leave one here instead of calling; notes cannot be edited or deleted.</p>';
        return log.map((n) => `<div class="note-bubble ${n.by === 'Kevin' ? 'kevin' : 'me'}"><div class="note-meta"><b>${esc(n.by)}</b> · ${esc(noteTime(n.at))}</div><div class="note-text">${esc(n.text)}</div></div>`).join('');
      }
      function notesBoxHtml(c) {
        if (!Array.isArray(c.notesLog)) return ''; // only Kevin's all-cases link gets notes
        const id = esc(c.id);
        return `<details class="notes-box" data-notes-for="${id}"${openNotes.has(c.id) ? ' open' : ''}>` +
          `<summary>💬 Notes (${c.notesLog.length})</summary>` +
          `<div class="notes-thread">${threadHtml(c)}</div>` +
          `<textarea class="note-input" rows="3" maxlength="2000" placeholder="Leave a note for Jeremy…" data-id="${id}">${esc(drafts[c.id] || '')}</textarea>` +
          `<button type="button" class="btn primary note-add-btn" data-id="${id}">Send note</button>` +
          `<p class="note-status"></p></details>`;
      }

      function renderCases(cases) {
        if (!cases.length) {
          listEl.innerHTML = '<p class="hint">No matching cases.</p>';
          return;
        }
        listEl.innerHTML = cases
          .map((c) => {
            const style = `${c.plaintiff || 'Unknown Plaintiff'} v. ${c.defendant || 'Unknown Defendant'}`;
            let statusLabel;
            if (c.status === 'closed') statusLabel = c.returnOutcome || 'Closed';
            else if (c.returnSent) statusLabel = 'Returned — affidavit pending';
            else statusLabel = 'Open';
            const statusPillClass = c.status === 'closed' ? 'status-pill status-pill-closed' : 'status-pill status-pill-open';
            const intake = c.intakeDate ? new Date(c.intakeDate).toLocaleDateString('en-US') : '';
            const sortedAttempts = (c.attempts || []).slice().sort((a, b) => a.n - b.n);
            const attemptHistory = sortedAttempts.length
              ? `<div class="attempt-history">` +
                `<div class="attempt-history-title">Attempts (${sortedAttempts.length}):</div>` +
                sortedAttempts
                  .map((a) => {
                    const photoNote = a.hasPhoto
                      ? ` · photo on file${a.photoTimestamp ? ', timestamped ' + new Date(a.photoTimestamp).toLocaleString('en-US') : ''}`
                      : '';
                    const noteText = a.note ? a.note.replace(/</g, '&lt;') : '(no note)';
                    const gpsNote = a.gpsVerifiedAt
                      ? ` · 📍 GPS-verified ${new Date(a.gpsVerifiedAt).toLocaleString('en-US', { timeZone: 'America/Chicago' })}`
                      : '';
                    return `<div class="attempt-history-line">#${a.n} — ${a.date || 'no date'}: ${noteText}${photoNote}${gpsNote}</div>`;
                  })
                  .join('') +
                `</div>`
              : '';
            return `
              <div class="case-row">
                <div class="case-style">${style}</div>
                <div class="case-meta">Case No. ${c.caseNo || 'N/A'} — ${c.attorney || ''}${c.caseType ? ' — ' + c.caseType : ''}</div>
                <div class="case-meta">${c.serviceAddress || ''}</div>
                <div class="case-meta">Logged ${intake}</div>
                <span class="${statusPillClass}">${statusLabel}${c.returnDate ? ' · Returned ' + c.returnDate : ''}</span>
                ${c.hasReturnPdf ? `<button type="button" class="btn secondary view-return-btn" data-id="${String(c.id).replace(/"/g, '&quot;')}" style="margin-top:.4rem;">View return PDF</button>` : ''}
                ${attemptHistory}
                ${notesBoxHtml(c)}
              </div>`;
          })
          .join('');
      }

      function applyFilters() {
        const query = searchInput.value.trim().toLowerCase();
        const dateVal = dateFilter.value; // YYYY-MM-DD or ''

        const filtered = allCases.filter((c) => {
          if (dateVal) {
            const caseDate = c.intakeDate ? new Date(c.intakeDate).toISOString().slice(0, 10) : null;
            if (caseDate !== dateVal) return false;
          }
          if (query) {
            const haystack = [c.defendant, c.plaintiff, c.attorney, c.serviceAddress, ...(c.defendants || []).map((d) => d.name)]
              .filter(Boolean)
              .join(' ')
              .toLowerCase();
            if (!haystack.includes(query)) return false;
          }
          return true;
        });

        subtitleEl.textContent = `${filtered.length} case${filtered.length === 1 ? '' : 's'} shown (of ${allCases.length} total).`;
        renderCases(filtered);
      }

      // View a return PDF -- token-checked server-side, so a firm link
      // can only open returns for its own attorney's cases.
      listEl.addEventListener('click', async (e) => {
        const btn = e.target.closest('.view-return-btn');
        if (!btn) return;
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Opening…';
        try {
          const res = await fetch('/.netlify/functions/view-return-pdf?token=' + encodeURIComponent(token) + '&id=' + encodeURIComponent(btn.dataset.id));
          if (!res.ok) throw new Error(await res.text());
          const { url } = await res.json();
          window.open(url, '_blank');
        } catch (err) {
          alert('Could not open the return PDF. (' + err.message + ')');
        } finally {
          btn.disabled = false;
          btn.textContent = original;
        }
      });

      listEl.addEventListener('input', (e) => {
        const ta = e.target.closest('.note-input');
        if (ta) drafts[ta.dataset.id] = ta.value;
      });
      listEl.addEventListener('toggle', (e) => {
        const d = e.target.closest && e.target.closest('details.notes-box');
        if (!d) return;
        if (d.open) openNotes.add(d.dataset.notesFor); else openNotes.delete(d.dataset.notesFor);
      }, true);
      listEl.addEventListener('click', async (e) => {
        const btn = e.target.closest('.note-add-btn');
        if (!btn) return;
        const box = btn.closest('.notes-box');
        const st = box.querySelector('.note-status');
        const text = (drafts[btn.dataset.id] || '').trim();
        if (!text) { st.textContent = 'Write a note first.'; return; }
        btn.disabled = true; st.textContent = 'Sending…';
        try {
          const res = await fetch('/.netlify/functions/add-note', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: btn.dataset.id, text, token })
          });
          if (!res.ok) throw new Error(await res.text());
          const { note } = await res.json();
          const c = allCases.find((x) => String(x.id) === btn.dataset.id);
          if (c) { c.notesLog = (c.notesLog || []).concat([note]); box.querySelector('.notes-thread').innerHTML = threadHtml(c); box.querySelector('summary').textContent = `💬 Notes (${c.notesLog.length})`; }
          drafts[btn.dataset.id] = ''; box.querySelector('.note-input').value = '';
          st.textContent = 'Sent. Jeremy has been notified.';
        } catch (err) {
          st.textContent = 'Not sent — ' + err.message + ' (your text is still here)';
        }
        btn.disabled = false;
      });

      searchInput.addEventListener('input', applyFilters);
      dateFilter.addEventListener('change', applyFilters);

      fetch('/.netlify/functions/view-cases?token=' + encodeURIComponent(token))
        .then(async (res) => {
          if (!res.ok) throw new Error(await res.text());
          return res.json();
        })
        .then(({ label, cases }) => {
          titleEl.textContent = label ? `Case Status — ${label}` : 'Case Status';
          allCases = cases || [];
          if (!allCases.length) {
            subtitleEl.textContent = 'No cases on file yet.';
            return;
          }
          subtitleEl.textContent = `${allCases.length} case${allCases.length === 1 ? '' : 's'} on file.`;
          renderCases(allCases);
        })
        .catch((err) => {
          subtitleEl.textContent = 'Could not load cases. (' + err.message + ')';
        });

      // Invoices -- only shows up at all for Kevin's ALL-scope link; a
      // firm-scoped link gets an empty array back and this section just
      // stays hidden.
      const invoicesSection = document.getElementById('invoicesSection');
      const invoicesListEl = document.getElementById('invoicesList');
      fetch('/.netlify/functions/view-invoices?token=' + encodeURIComponent(token))
        .then(async (res) => {
          if (!res.ok) return { invoices: [] };
          return res.json();
        })
        .then(({ invoices }) => {
          if (!invoices || !invoices.length) return;
          invoicesSection.hidden = false;
          invoicesListEl.innerHTML = invoices
            .map((inv) => {
              const generated = inv.generated_at ? new Date(inv.generated_at).toLocaleString('en-US') : '';
              const total = Number(inv.total || 0).toFixed(2);
              return (
                `<div class="case-row">` +
                `<div class="case-style">${inv.week_label || inv.week_key}</div>` +
                `<div class="case-meta">${inv.billable_count} case${inv.billable_count === 1 ? '' : 's'} — $${total} total</div>` +
                `<div class="case-meta">Generated ${generated}</div>` +
                `<button type="button" class="btn secondary view-invoice-btn" data-week="${inv.week_key}" style="margin-top:.4rem;">View PDF</button>` +
                `</div>`
              );
            })
            .join('');
          invoicesListEl.querySelectorAll('.view-invoice-btn').forEach((btn) => {
            btn.addEventListener('click', async () => {
              const weekKey = btn.dataset.week;
              const original = btn.textContent;
              btn.disabled = true;
              btn.textContent = 'Opening…';
              try {
                const res = await fetch('/.netlify/functions/get-invoice-pdf?token=' + encodeURIComponent(token) + '&week=' + encodeURIComponent(weekKey));
                if (!res.ok) throw new Error(await res.text());
                const { url } = await res.json();
                window.open(url, '_blank');
              } catch (err) {
                alert('Failed to open invoice. (' + err.message + ')');
              } finally {
                btn.disabled = false;
                btn.textContent = original;
              }
            });
          });
        })
        .catch(() => {
          // Silently ignore -- invoices are a bonus section, never block
          // the main case list over it.
        });
    })();
  </script>
</body>
</html>
